<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2026 跑跑動動 - 角色選擇</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- 3D 滿版背景 -->
  <canvas id="bg-canvas"></canvas>

  <!-- 初始懸浮按鈕 -->
  <button id="open-panel-btn" class="floating-btn">今日工事</button>

  <!-- 草地正下方的動動碎碎念卡片輪播 Bar -->
  <div class="ticker-container-card">
    <button class="ticker-nav-btn" onclick="slideMurmur(-1)">❮</button>
    <div id="ticker-cards-wrapper" class="ticker-cards-wrapper">
      <!-- 這裡會透過 JS 動態帶入最多 3 張獨立泡泡卡片 -->
    </div>
    <button class="ticker-nav-btn" onclick="slideMurmur(1)">❯</button>
  </div>

  <!-- 今日工事選單 UI (預設隱藏) -->
  <div class="main-container hidden" id="main-content">
      <button id="close-panel-btn" class="close-x">×</button>

      <div class="section-header"><div class="section-title">今日工事</div></div>
      
      <div class="controls-wrapper">
          <!-- 獨立預覽區 (頭像與裝備分開呈現) -->
          <div class="preview-container">
              <div class="preview-box">
                  <img id="preview-avatar" src="" alt="頭像" style="display:none;">
                  <img id="preview-hand" src="" alt="裝備" style="display:none;">
                  <span id="preview-placeholder">尚未選擇角色</span>
              </div>
          </div>

          <div class="control-row">
              <div class="input-box">
                  <label>是哪位運動家</label>
                  <select id="user-select" class="form-input"><option value="">+ 新成員</option></select>
              </div>
              <div id="new-name-box" class="input-box">
                  <label>新成員名字</label>
                  <input type="text" id="new-name" maxlength="8" class="form-input" placeholder="輸入新名字">
              </div>
              <div class="input-box">
                  <div style="height:19px"></div>
                  <button id="avatar-btn" class="action-btn primary-btn" onclick="openModal('char')">挑選頭像</button>
              </div>
              <div class="input-box" id="hand-box" style="display: none;">
                  <div style="height:19px"></div>
                  <button id="hand-btn" class="action-btn secondary-btn" onclick="openModal('hand')">挑選裝備</button>
              </div>
          </div>
          
          <div class="control-row" style="margin-top: 15px;">
              <div class="input-box" style="flex:0.6">
                  <label>今日運動時數</label>
                  <input type="number" id="mins" placeholder="分鐘" class="form-input">
              </div>
              <div class="input-box">
                  <label>運動類型</label>
                  <select id="sport-type" class="form-input">
                      <option value="健走">健走</option>
                      <option value="跑步">跑步</option>
                      <option value="登山">登山</option>
                      <option value="有氧">有氧</option>
                      <option value="瑜珈">瑜珈</option>
                      <option value="單車">單車</option>
                      <option value="游泳">游泳</option>
                      <option value="肌力訓練">肌力訓練</option>
                      <option value="HiIT間歇訓練">HiIT間歇訓練</option>
                      <option value="皮拉提斯">皮拉提斯</option>
                      <option value="球類">球類</option>
                      <option value="拉筋">拉筋</option>
                      <option value="跳舞">跳舞</option>
                      <option value="其他">其他</option>
                  </select>
              </div>
          </div>

          <!-- 新增 Murmur 留言輸入框 -->
          <div class="control-row" style="margin-top: 15px;">
              <div class="input-box" style="flex: 1;">
                  <label>今日 Murmur (心情小語)</label>
                  <input type="text" id="murmur-input" maxlength="30" class="form-input" placeholder="寫一句今日心情，會出現在下方輪播喔！">
              </div>
          </div>

          <div class="control-row" style="margin-top: 20px;">
              <button id="submit-btn" class="action-btn submit-btn" onclick="submitData()">確認送出</button>
          </div>
      </div>
  </div>

  <!-- 圖片選擇列表彈出視窗 -->
  <div id="selector-modal" class="modal hidden">
    <div class="modal-content">
      <h2 id="modal-title" style="margin-top:0;">請選擇</h2>
      <div id="items-grid" class="grid-container"></div>
      <button class="close-btn" onclick="closeModal()">關閉</button>
    </div>
  </div>

  <!-- 點擊角色後的運動紀錄彈窗 (Modal) -->
  <div id="record-modal" class="modal hidden">
    <div class="modal-content">
      <h2 id="record-title" style="margin-top:0; color:#2c5282;">運動紀錄</h2>
      <div id="record-body" style="text-align: left; margin: 15px 0; font-size: 14px; line-height: 1.6;"></div>
      <button class="close-btn" onclick="closeRecordModal()">關閉</button>
    </div>
  </div>

  <!-- 引入 Three.js 與 CSS2DRenderer 外掛 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/renderers/CSS2DRenderer.js"></script>
  
  <!-- 引入 Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
  <script src="main.js"></script>
</body>
</html>
