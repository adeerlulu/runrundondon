<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2026 跑跑動動 - 角色選擇</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- 3D 滿版背景 -->
  <canvas id="bg-canvas"></canvas>

  <!-- 你的選單 UI -->
  <div class="main-container" id="main-content">
      <div class="logo-container">
          <img src="https://raw.githubusercontent.com/adeerlulu/runrundondon/main/links/LOGO.png" class="main-logo" alt="LOGO">
      </div>

      <div class="section-header"><div class="section-title">今日工事</div></div>
      
      <div class="controls-wrapper">
          <div class="control-row">
              <div class="input-box">
                  <label>是哪位運動家</label>
                  <select id="user-select"><option value="">+ 新成員</option></select>
              </div>
              <div id="new-name-box" class="input-box">
                  <label>新成員名字</label>
                  <input type="text" id="new-name" maxlength="8">
              </div>
              <div class="input-box">
                  <div style="height:19px"></div>
                  <!-- 呼叫開啟選角 Modal -->
                  <button id="avatar-btn" style="background:#2c5282; color:white; border:none; padding:12px; border-radius:12px; cursor:pointer; width:100%; font-weight:bold; height:48px;" onclick="openModal('char')">挑選頭像</button>
              </div>
              <div class="input-box" id="hand-box" style="display: none;">
                  <div style="height:19px"></div>
                  <!-- 呼叫開啟手勢 Modal -->
                  <button id="hand-btn" style="background:#2b6cb0; color:white; border:none; padding:12px; border-radius:12px; cursor:pointer; width:100%; font-weight:bold; height:48px;" onclick="openModal('hand')">挑選裝備</button>
              </div>
          </div>
          
          <div class="control-row" style="margin-top: 15px;">
              <div class="input-box" style="flex:0.6">
                  <label>今日運動時數</label>
                  <input type="number" id="mins" placeholder="分鐘" style="width: 100%; padding: 8px; border-radius: 8px; border: 1px solid #ccc;">
              </div>
              <div class="input-box">
                  <label>運動類型</label>
                  <select id="sport-type" style="width: 100%; padding: 8px; border-radius: 8px; border: 1px solid #ccc;">
                      <option value="健走">健走</option>
                      <option value="跑步">跑步</option>
                      <option value="登山">登山</option>
                      <option value="有氧">有氧</option>
                      <option value="瑜珈">瑜珈</option>
                      <option value="單車">單車</option>
                      <option value="游泳">游泳</option>
                      <option value="肌力訓練">肌力訓練</option>
                      <option value="HiIT間歇訓練">HiIT間歇訓練</option>
                      <option value="皮拉提斯">皮拉提斯</option>
                      <option value="球類">球類</option>
                      <option value="拉筋">拉筋</option>
                      <option value="跳舞">跳舞</option>
                      <option value="其他">其他可請管理員新增</option>
                  </select>
              </div>
          </div>
      </div>
  </div>

  <!-- 圖片選擇列表彈出視窗 -->
  <div id="selector-modal" class="modal hidden">
    <div class="modal-content">
      <h2 id="modal-title" style="margin-top:0;">請選擇</h2>
      <div id="items-grid" class="grid-container"></div>
      <button class="close-btn" onclick="closeModal()">關閉</button>
    </div>
  </div>

  <!-- 引入 Three.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="main.js"></script>
</body>
</html>
